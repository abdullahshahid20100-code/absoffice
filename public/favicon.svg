<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="absGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#absGrad)" filter="url(#shadow)" />

  <!-- Inner Document Sheet -->
  <rect x="14" y="12" width="36" height="40" rx="4" fill="#ffffff" fill-opacity="0.95" />

  <!-- Sheet Lines (Representing document text) -->
  <line x1="20" y1="20" x2="38" y2="20" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="26" x2="44" y2="26" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="32" x2="40" y2="32" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Urdu 'قلم' / Calligraphy Nib Accent in bottom-right -->
  <path d="M36 44 L44 36 L46 38 L38 46 L34 46 Z" fill="#7c3aed" />
  <circle cx="43" cy="39" r="1" fill="#ffffff" />
</svg>
